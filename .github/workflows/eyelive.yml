# EyeLive CI (integrator-owned). Every pull request: ownership check for task branches, build + tests of all eyelive modules on Linux and macOS, sanitizer build on Linux, GUI build + --shot smoke test when gui/ changed.
name: eyelive
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ownership:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 cpp/app/ci/check_ownership.py "${{ github.head_ref }}" "origin/${{ github.base_ref }}"
  build-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-numpy
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - run: cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: Publish compiler errors in the run summary (readable without signing in)
        if: failure()
        shell: bash
        run: |
          grep -E ": error|undefined reference|ld returned|CMake Error|ninja: build stopped" build.log | head -8 | cut -c1-300 | while IFS= read -r l; do echo "::error title=compile::$l"; done
          { echo "### ${{ github.job }}: build errors"; echo '```'; grep -E ": error|undefined reference|ld returned|CMake Error|FAILED:" build.log | head -40 | cut -c1-400; echo '```'; echo "### last lines"; echo '```'; tail -60 build.log | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Test all eyelive modules
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -L eyelive --output-on-failure --timeout 900 2>&1 | tee ctest.log
      - name: Commands of the manual (eyelive_cli and eyelive_tool)
        shell: bash
        run: sh docs/eyelive/check_commands.sh build/app/cli/eyelive_cli cpp/models build/app/cli/eyelive_tool
      - name: Publish test failures in the run summary (readable without signing in)
        if: failure()
        shell: bash
        run: |
          grep -E "Failed|Timeout|\*\*\*|FAIL|^auto:" ctest.log | head -14 | cut -c1-400 | while IFS= read -r l; do echo "::error title=test::$l"; done
          { echo "### ${{ matrix.os }}: failing tests"; echo '```'; grep -E "^\s*[0-9]+/[0-9]+ Test .*(Failed|Timeout|Exception)|The following tests FAILED|^\s+[0-9]+ - " ctest.log | head -40; echo '```'; echo "### last lines of the log"; echo '```'; tail -120 ctest.log | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sanitize: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build python3-numpy
      - run: cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUNEYE_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: Publish compiler errors in the run summary (readable without signing in)
        if: failure()
        shell: bash
        run: |
          grep -E ": error|undefined reference|ld returned|CMake Error|ninja: build stopped" build.log | head -8 | cut -c1-300 | while IFS= read -r l; do echo "::error title=compile::$l"; done
          { echo "### ${{ github.job }}: build errors"; echo '```'; grep -E ": error|undefined reference|ld returned|CMake Error|FAILED:" build.log | head -40 | cut -c1-400; echo '```'; echo "### last lines"; echo '```'; tail -60 build.log | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -L eyelive --output-on-failure --timeout 900 2>&1 | tee ctest.log
      - name: Publish test failures in the run summary (readable without signing in)
        if: failure()
        shell: bash
        run: |
          grep -E "Failed|Timeout|\*\*\*|FAIL|ThreadSanitizer|AddressSanitizer" ctest.log | head -8 | cut -c1-300 | while IFS= read -r l; do echo "::error title=test::$l"; done
          { echo "### sanitizer ${{ matrix.sanitize }}: failing tests"; echo '```'; grep -E "^\s*[0-9]+/[0-9]+ Test .*(Failed|Timeout|Exception)|The following tests FAILED|^\s+[0-9]+ - |WARNING: ThreadSanitizer|ERROR: AddressSanitizer|SUMMARY:" ctest.log | head -40; echo '```'; echo "### last lines of the log"; echo '```'; tail -150 ctest.log | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build xorg-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev xvfb
      - run: sh cpp/third_party/fetch.sh
      - run: cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEYELIVE_BUILD_GUI=ON -DGLFW_BUILD_WAYLAND=OFF
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: Publish compiler errors in the run summary (readable without signing in)
        if: failure()
        shell: bash
        run: |
          grep -E ": error|undefined reference|ld returned|CMake Error|ninja: build stopped" build.log | head -8 | cut -c1-300 | while IFS= read -r l; do echo "::error title=compile::$l"; done
          { echo "### ${{ github.job }}: build errors"; echo '```'; grep -E ": error|undefined reference|ld returned|CMake Error|FAILED:" build.log | head -40 | cut -c1-400; echo '```'; echo "### last lines"; echo '```'; tail -60 build.log | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: GUI smoke tests (offscreen frames; the image must not be uniform)
        run: |
          set -e
          xvfb-run -a build/app/gui/eyelive --mock --shot /tmp/a.ppm --frames 5
          python3 - <<'PY'
          d = open('/tmp/a.ppm', 'rb').read(); body = d[d.index(b'255\n') + 4:]; assert len(set(body[i] for i in range(0, len(body), 997))) > 8, 'uniform image'; print('shot ok', len(d), 'bytes')
          PY
          xvfb-run -a build/app/gui/eyelive --demo --tab Review --shot /tmp/b.ppm --frames 5
          # the simplified interface: every mode, and the first-launch wizard (isolated settings, profiles and session folders)
          for m in Record Review Analyze Help Advanced; do xvfb-run -a build/app/gui/eyelive --mock --no-wizard --mode $m --settings /tmp/ui_settings.txt --profiles-dir /tmp/ui_profiles --session-dir /tmp/ui_sessions --shot /tmp/mode_$m.ppm --frames 5; done
          xvfb-run -a build/app/gui/eyelive --mock --wizard --settings /tmp/ui_settings.txt --profiles-dir /tmp/ui_profiles --session-dir /tmp/ui_sessions --shot /tmp/wizard.ppm --frames 5
          python3 - <<'PY'
          for f in ['Record', 'Review', 'Analyze', 'Help', 'Advanced']:
              d = open('/tmp/mode_%s.ppm' % f, 'rb').read(); body = d[d.index(b'255\n') + 4:]; assert len(set(body[i] for i in range(0, len(body), 997))) > 8, 'uniform image in mode ' + f
          a = open('/tmp/mode_Record.ppm', 'rb').read(); w = open('/tmp/wizard.ppm', 'rb').read(); assert a != w, 'the wizard changes nothing on the screen'; print('mode and wizard shots ok')
          PY
          ctest --test-dir build -L gui --output-on-failure
