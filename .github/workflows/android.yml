name: android

on:
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - 'cpp/**'
      - '.github/workflows/android.yml'
      # the app shows the web labeler (copied into the APK by syncWebAssets)
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'formats.js'
      - 'import.js'
      - 'import_ui.js'
      - 'train_worker.js'
      - 'sw.js'
      - 'web/**'
      - 'models/**'
  pull_request:
    paths:
      - 'android/**'
      - 'cpp/**'
      - '.github/workflows/android.yml'
      # the app shows the web labeler (copied into the APK by syncWebAssets)
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'formats.js'
      - 'import.js'
      - 'import_ui.js'
      - 'train_worker.js'
      - 'sw.js'
      - 'web/**'
      - 'models/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android JVM unit tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK and ZIP
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk uneye-android.apk
          zip -j uneye-android.zip uneye-android.apk
          sha256sum uneye-android.apk uneye-android.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # master builds are published to the single android-latest release below; only pull requests need a temporary artifact
      - name: Upload Build Artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: uneye-android-build
          retention-days: 3
          path: |
            uneye-android.apk
            uneye-android.zip
            SHA256SUMS.txt

      - name: Update git tag
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f android-latest
          git push -f origin android-latest

      - name: Publish Android Release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "UnEye Android App (Latest Build)"
          body: |
            Automated continuous build of the U'n'Eye Android app for offline saccade and blink labeling.
            
            ### Downloads for Android Smartphone & Tablet:
            - 📦 **[uneye-android.zip](https://github.com/jobellet/uneye/releases/download/android-latest/uneye-android.zip)** *(Recommended for smartphones & GitHub mobile app: download, extract, tap `uneye-android.apk` to install)*
            - 📱 **[uneye-android.apk](https://github.com/jobellet/uneye/releases/download/android-latest/uneye-android.apk)** *(Direct APK download for web browsers)*
            
            **Installation tip:** If your phone displays an "Install unknown apps" security prompt, allow your browser or file manager to install APKs.
            
            *Built from commit `${{ github.sha }}`.*
          files: |
            uneye-android.apk
            uneye-android.zip
            SHA256SUMS.txt
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
